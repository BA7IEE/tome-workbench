# This profile is isolated from compose.yaml and does not mount development data.
name: tome-production
x-runtime: &runtime
  image: tome-workbench:${TOME_IMAGE_TAG:?Generate compose.env with production-config.mjs}
  build: {context: ., target: runtime, args: {APP_VERSION: "${TOME_IMAGE_TAG:?Application version required}"}}
  env_file: ["${TOME_CONFIG_DIR:-./data/production}/api.env"]
  environment: {RUNTIME_DIR: /tmp/tome-run}
  volumes: ["tome_media:/app/data"]
  tmpfs: ["/tmp:rw,nosuid,size=128m"]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  stop_grace_period: 40s
  mem_limit: 768m
  pids_limit: 128
  depends_on: {postgres: {condition: service_healthy}}
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment: {POSTGRES_USER: tome_owner, POSTGRES_DB: tome_production, POSTGRES_PASSWORD_FILE: /run/secrets/owner_password}
    secrets: [owner_password, app_password]
    volumes: ["tome_database:/var/lib/postgresql/data", "./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro"]
    restart: unless-stopped
    healthcheck: {test: [CMD-SHELL, "pg_isready -U tome_owner -d tome_production"], interval: 3s, timeout: 3s, retries: 30}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  api-a:
    <<: *runtime
  api-b:
    <<: *runtime
  worker-a: &worker
    <<: *runtime
    command: [scripts/supervise-container.mjs, worker]
    healthcheck: {test: [CMD, node, scripts/probe.mjs, worker], interval: 10s, timeout: 4s, start_period: 40s, retries: 3}
  worker-b:
    <<: *worker
  migration:
    image: tome-workbench-migration:${TOME_IMAGE_TAG:?Generate compose.env with production-config.mjs}
    build: {context: ., target: migration, args: {APP_VERSION: "${TOME_IMAGE_TAG:?Application version required}"}}
    profiles: [tools]
    env_file: ["${TOME_CONFIG_DIR:-./data/production}/migration.env"]
    depends_on: {postgres: {condition: service_healthy}}
    volumes: ["${TOME_CONFIG_DIR:-./data/production}/backups:/backups"]
  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    env_file: ["${TOME_CONFIG_DIR:-./data/production}/proxy.env"]
    ports: ["${TOME_BIND:-127.0.0.1}:${TOME_HTTPS_PORT:-443}:443", "${TOME_BIND:-127.0.0.1}:${TOME_HTTP_PORT:-80}:80"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "tome_caddy:/data", "tome_caddy_config:/config"]
    depends_on: {api-a: {condition: service_healthy}, api-b: {condition: service_healthy}}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
secrets:
  owner_password: {file: "${TOME_CONFIG_DIR:-./data/production}/owner-password.txt"}
  app_password: {file: "${TOME_CONFIG_DIR:-./data/production}/app-password.txt"}
volumes: {tome_database: {}, tome_media: {}, tome_caddy: {}, tome_caddy_config: {}}
