name: tome-workbench
services:
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    env_file: ./data/postgres.env
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tome -d tome_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
