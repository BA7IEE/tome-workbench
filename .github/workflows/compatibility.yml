name: ToMe compatibility check
permissions:
  contents: read
on: [workflow_dispatch]
jobs:
  compatibility:
    continue-on-error: true
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tome
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: tome_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tome -d tome_dev"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://tome:disposable-ci-only@127.0.0.1:5432/tome_dev
      APP_ENV: test
      EXTERNAL_EFFECTS_ENABLED: 'false'
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: node scripts/prepare-test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run harness:full
        env:
          TOME_PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-reports
          path: |
            reports/
            data/browser-artifacts/**/*.png
            data/browser-artifacts/**/error-context.md
            data/browser-webkit-artifacts/**/*.png
            data/browser-webkit-artifacts/**/error-context.md
