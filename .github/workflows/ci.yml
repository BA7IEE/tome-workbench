name: ToMe isolated verification
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tome-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: tome
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: tome_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tome -d tome_dev"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://tome:disposable-ci-only@127.0.0.1:5432/tome_dev
      APP_ENV: test
      EXTERNAL_EFFECTS_ENABLED: "false"
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci
      - run: node scripts/check-admin-foundation.mjs
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: node scripts/prepare-test.mjs
      - run: npm run test:production-bootstrap
        env:
          TOME_BOOTSTRAP_TEST_APPROVED: "YES"
      - run: npx playwright install --with-deps chromium webkit
      - name: Run full isolated release verification
        run: |
          if ! npm run verify:release; then
            # The verifier writes detailed output to a synthetic-only local log.
            # Show the failure cause; do not upload screenshots or data fixtures.
            if [ -f reports/release-verification.log ]; then
              cat reports/release-verification.log
            fi
            exit 1
          fi
        env:
          TOME_PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm audit --audit-level=high
      - run: npm run pack
      - name: Save verified frontend for an isolated local preview
        uses: actions/upload-artifact@v4
        with:
          name: local-preview-web
          retention-days: 1
          path: dist/web/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          retention-days: 3
          if-no-files-found: warn
          path: |
            docs/validation/*/summary.json
            reports/browser.json
            reports/browser-webkit.json
            reports/harness.json
