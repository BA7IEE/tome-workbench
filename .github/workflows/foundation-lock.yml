name: Resolve Foundation dependency lock
permissions:
  contents: read
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/foundation-lock.yml
concurrency:
  group: tome-foundation-lock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      # Metadata resolution only. No package lifecycle scripts, DB or service.
      # Download/review/commit this result, then verify the exact committed head.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-dependency-lock
          retention-days: 3
          path: package-lock.json
