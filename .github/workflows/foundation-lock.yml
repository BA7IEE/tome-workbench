name: Resolve audited dependency patches
permissions:
  contents: read
on:
  pull_request:
    paths:
      - .github/workflows/foundation-lock.yml
concurrency:
  group: tome-foundation-lock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      # Resolve only the two audited compatible transitive patches.
      # No package lifecycle scripts, database or application service.
      - run: npm update proxy-addr source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-dependency-lock
          retention-days: 1
          path: package-lock.json
